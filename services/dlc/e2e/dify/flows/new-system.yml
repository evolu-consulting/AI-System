      zIndex: 0
      data:
        sourceType: human-input
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: end_af_d-source-end_af
      source: end_af_d
      sourceHandle: source
      target: end_af
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    - id: approve-reject-end_rej_d
      source: approve
      sourceHandle: reject
      target: end_rej_d
      targetHandle: target
      type: custom
      zIndex: 0
      data:
