      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: end_sf_d-source-end_sf
      source: end_sf_d
      sourceHandle: source
      target: end_sf
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    - id: pick-stop-end_stop_d
      source: pick
      sourceHandle: stop
      target: end_stop_d
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
