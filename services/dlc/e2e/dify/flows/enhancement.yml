app:
  mode: workflow
  name: DLC · Enhancement (local)
  description: 'Enhancement: a sizer group, a person picks the level (passed into
    the run task), build, deliver.'
  icon: 🛠
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: start
        title: Start
        variables:
        - variable: request
          label: request
          type: paragraph
          required: true
          max_length: 100000
          options: []
        - variable: kind
          label: kind
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: given_level
          label: given_level
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: project
          label: project
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: run
          label: run
          type: text-input
          required: false
          max_length: 256
          options: []
        selected: false
    - id: size
      type: custom
      position:
        x: 300
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: human-input
        title: 'DLC: size'
        desc: ''
        delivery_methods:
        - id: ec1e3471-9dd1-47e5-b3ec-bdfbde85c179
          type: webapp
          enabled: true
        form_content: 'Engine task.


          ```dlc {"agents": ["change_sizer"], "goal": "Say the level 1-4 of this change
          and why, in two lines.", "max_usd": 0.3}```'
        inputs:
        - type: paragraph
          output_variable_name: result
          default:
            selector: []
            type: constant
            value: ''
        user_actions:
        - id: done
          title: Done
          button_style: primary
        - id: failed
          title: Failed
          button_style: default
        timeout: 3
        timeout_unit: day
        selected: false
    - id: pick
      type: custom
      position:
        x: 600
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: human-input
        title: Pick the level
        desc: ''
        delivery_methods:
        - id: 82c5d874-5a9d-4a1d-8a50-155ffbda3f39
          type: webapp
          enabled: true
        form_content: 'The sizer says:


          {{#size.result#}}


          Given level: {{#start.given_level#}}. Write the level (1-4) to build at.'
        inputs:
        - type: paragraph
          output_variable_name: level
          default:
            selector: []
            type: constant
            value: ''
        user_actions:
        - id: go
          title: Go
          button_style: primary
        - id: stop
          title: Stop
          button_style: default
        timeout: 3
        timeout_unit: day
        selected: false
    - id: build
      type: custom
      position:
        x: 900
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: human-input
        title: 'DLC: run'
        desc: ''
        delivery_methods:
        - id: 2e4a7d5e-4e0e-4bef-8f21-89135a84c652
          type: webapp
          enabled: true
        form_content: 'Build at the chosen level.


          ```dlc {"level": "{{#pick.level#}}"}```'
        inputs:
        - type: paragraph
          output_variable_name: result
          default:
            selector: []
            type: constant
            value: ''
        user_actions:
        - id: done
          title: Done
          button_style: primary
        - id: failed
          title: Failed
          button_style: default
        timeout: 3
        timeout_unit: day
        selected: false
    - id: deliver
      type: custom
      position:
        x: 1200
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: human-input
        title: 'DLC: deliver'
        desc: ''
        delivery_methods:
        - id: 026147e5-ea55-4a17-b76b-33dc84f2cda9
          type: webapp
          enabled: true
        form_content: 'Push the project to its repository.


          ```dlc {}```'
        inputs:
        - type: paragraph
          output_variable_name: result
          default:
            selector: []
            type: constant
            value: ''
        user_actions:
        - id: done
          title: Done
          button_style: primary
        - id: failed
          title: Failed
          button_style: default
        timeout: 3
        timeout_unit: day
        selected: false
    - id: ok_d
      type: custom
      position:
        x: 1500
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: delivered'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'delivered'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_ok
      type: custom
      position:
        x: 1800
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - ok_d
          - decision
        selected: false
    - id: end_sf_d
      type: custom
      position:
        x: 2100
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: sizing failed'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'sizing failed'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_sf
      type: custom
      position:
        x: 2400
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - end_sf_d
          - decision
        selected: false
    - id: end_stop_d
      type: custom
      position:
        x: 2700
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: stopped by a person'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'stopped by a person'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_stop
      type: custom
      position:
        x: 3000
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - end_stop_d
          - decision
        selected: false
    - id: end_bf_d
      type: custom
      position:
        x: 3300
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: build failed'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'build failed'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_bf
      type: custom
      position:
        x: 3600
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - end_bf_d
          - decision
        selected: false
    - id: end_df_d
      type: custom
      position:
        x: 3900
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: deliver failed'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'deliver failed'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_df
      type: custom
      position:
        x: 4200
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - end_df_d
          - decision
        selected: false
    edges:
    - id: start-source-size
      source: start
      sourceHandle: source
      target: size
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: size-done-pick
      source: size
      sourceHandle: done
      target: pick
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: pick-go-build
      source: pick
      sourceHandle: go
      target: build
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: build-done-deliver
      source: build
      sourceHandle: done
      target: deliver
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: deliver-done-ok_d
      source: deliver
      sourceHandle: done
      target: ok_d
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: ok_d-source-end_ok
      source: ok_d
      sourceHandle: source
      target: end_ok
      targetHandle: target
      type: custom
