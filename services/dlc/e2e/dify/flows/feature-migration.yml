app:
  mode: workflow
  name: DLC · Feature Migration (local)
  description: 'Feature migration (flow 4) through Dify: does the engine hand it to
    the process at all?'
  icon: 🛠
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: start
        title: Start
        variables:
        - variable: request
          label: request
          type: paragraph
          required: true
          max_length: 100000
          options: []
        - variable: kind
          label: kind
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: given_level
          label: given_level
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: project
          label: project
          type: text-input
          required: false
          max_length: 256
          options: []
        - variable: run
          label: run
          type: text-input
          required: false
          max_length: 256
          options: []
        selected: false
    - id: build
      type: custom
      position:
        x: 300
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: human-input
        title: 'DLC: run'
        desc: ''
        delivery_methods:
        - id: f431d271-277f-4f89-ab7b-3fa9e2dd3518
          type: webapp
          enabled: true
        form_content: 'Migrate the feature.


          ```dlc {"level": 2}```'
        inputs:
        - type: paragraph
          output_variable_name: result
          default:
            selector: []
            type: constant
            value: ''
        user_actions:
        - id: done
          title: Done
          button_style: primary
        - id: failed
          title: Failed
          button_style: default
        timeout: 3
        timeout_unit: day
        selected: false
    - id: ok_d
      type: custom
      position:
        x: 600
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: migrated'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'migrated'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_ok
      type: custom
      position:
        x: 900
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - ok_d
          - decision
        selected: false
    - id: end_bf_d
      type: custom
      position:
        x: 1200
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: code
        title: 'Decision: migration failed'
        code_language: python3
        code: "def main() -> dict:\n    return {'decision': 'migration failed'}\n"
        variables: []
        outputs:
          decision:
            type: string
            children: null
        selected: false
    - id: end_bf
      type: custom
      position:
        x: 1500
        y: 300
      positionAbsolute:
        x: 0
        y: 0
      width: 244
      height: 90
      data:
        type: end
        title: End
        outputs:
        - variable: decision
          value_selector:
          - end_bf_d
          - decision
        selected: false
    edges:
    - id: start-source-build
      source: start
      sourceHandle: source
      target: build
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: human-input
        isInIteration: false
        isInLoop: false
    - id: build-done-ok_d
      source: build
      sourceHandle: done
      target: ok_d
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: ok_d-source-end_ok
      source: ok_d
      sourceHandle: source
      target: end_ok
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    - id: build-failed-end_bf_d
      source: build
      sourceHandle: failed
      target: end_bf_d
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: human-input
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: end_bf_d-source-end_bf
      source: end_bf_d
      sourceHandle: source
      target: end_bf
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.7
