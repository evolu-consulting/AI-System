[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kh-helper"
version = "1.19.2"
description = "Sign in to Knowledge Hub and call it as yourself, from a shell or as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
# All permissive: requests Apache-2.0, keyring MIT, mcp MIT.
dependencies = [
    "requests>=2.31,<3",
    "keyring>=25,<26",
    "mcp>=2.2,<3",
]

[project.scripts]
kh = "kh_helper.cli:main"

[tool.setuptools]
packages = ["kh_helper"]
