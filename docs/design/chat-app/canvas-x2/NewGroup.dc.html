<span style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 999px; background: #F0EEF4; color: #3B3450; font-size: 13px">Lan Nguyễn<button aria-label="Bỏ Lan Nguyễn" style="width: 22px; height: 22px; border: 0; border-radius: 999px; background: transparent; color: #635C78; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>

<label style="display: block"><span style="position: absolute; left: -9999px">Tìm người trong công ty</span>
<input value="ng" placeholder="Tìm theo tên hoặc username trong Acme Việt Nam" style="width: 100%; height: 36px; border: 1px solid #6B4FA0; border-radius: 8px; padding: 0 12px; font: 14px 'Be Vietnam Pro',sans-serif; color: #1D1733; box-sizing: border-box">
</label>

<span style="width: 28px; height: 28px; border-radius: 999px; background: #EFEDF3; color: #4F4865; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">LN</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 500">Lan Nguyễn</span><span style="font: 12px 'JetBrains Mono',monospace; color: #635C78">lan</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #F0EEF4; cursor: pointer">
<input type="checkbox" style="width: 18px; height: 18px; accent-color: #6B4FA0">
<span style="width: 28px; height: 28px; border-radius: 999px; background: #E3F4EC; color: #05603F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">NB</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 500">Ngọc Bùi</span><span style="font: 12px 'JetBrains Mono',monospace; color: #635C78">ngoc.bui</span></span>
</label>
<label style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer">
<input type="checkbox" style="width: 18px; height: 18px; accent-color: #6B4FA0">
<span style="width: 28px; height: 28px; border-radius: 999px; background: #FDF0DF; color: #7F3C04; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">TN</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-weight: 500">Tuấn Ngô</span><span style="font: 12px 'JetBrains Mono',monospace; color: #635C78">tuan.ngo</span></span>
</label>
</div>
<span style="font-size: 12px; color: #736C89; line-height: 1.5">Chỉ tìm được người đang hoạt động trong cùng công ty. Bạn là chủ nhóm: chỉ bạn thêm hoặc bớt người; ai cũng tự rời được. Thành viên mới xem được toàn bộ lịch sử.</span>
</div>
</div>

<footer style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #E6E3EE">

<a href="Main.dc.html" style="height: 36px; padding: 0 16px; border-radius: 8px; background: #6B4FA0; color: #FFFFFF; font: 600 14px 'Be Vietnam Pro',sans-serif; display: inline-flex; align-items: center; text-decoration: none">Tạo nhóm</a>
</footer>
