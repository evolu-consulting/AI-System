# UAT CR-095: project Docker "evotest" (chung ten voi run-tests.ps1, KHONG dung toi "aisystem"). Chi publish 127.0.0.1 tren may chu.
name: evotest
services:
  uatpg:
    image: postgres:16.15-alpine
    container_name: evotest-uat-pg
    environment: { POSTGRES_USER: ai, POSTGRES_PASSWORD: ai_dev_pw, POSTGRES_DB: ai_system }
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ai -d ai_system"], interval: 3s, timeout: 3s, retries: 30 }
    volumes: [ "uat-pgdata:/var/lib/postgresql/data" ]
    cpus: 2
    mem_limit: 4g
  uatredis:
    image: redis:7.4.11-alpine
    container_name: evotest-uat-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"], interval: 3s, timeout: 3s, retries: 30 }
    cpus: 0.5
    mem_limit: 1g
  uatapp:
    image: evotest-runner:bun-1.3.14
    container_name: evotest-uat-app
    user: "${EVO_UID:-1002}:${EVO_GID:-1002}"
    working_dir: /app
    environment: { HOME: /tmp/evohome, BUN_INSTALL_CACHE_DIR: /cache }
    volumes: [ "./app:/app", "../cache:/cache", "./out:/out", "./up.sh:/up.sh:ro", "./seed.ts:/seed.ts:ro" ]
    depends_on: { uatpg: { condition: service_healthy }, uatredis: { condition: service_healthy } }
    entrypoint: ["nice", "-n", "10", "bash", "/up.sh"]
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:13001:3001"
      - "127.0.0.1:13100:3100"
      - "127.0.0.1:13300:3300"
      - "127.0.0.1:14000:4000"
    cpus: 3
    mem_limit: 8g
    init: true
  uatrt:
    image: python:3.12-slim
    container_name: evotest-uat-rt
    user: "${EVO_UID:-1002}:${EVO_GID:-1002}"
    network_mode: "service:uatapp"
    working_dir: /app/apps/agent-runtime
    environment:
      HOME: /tmp/evohome
      APP_ENV: development
      AGENT_RT_DATABASE_URL: postgres://agent_runtime:agent_runtime_dev_pw@uatpg:5432/ai_system
      REDIS_URL: redis://uatredis:6379
      AGENT_RT_HUB_URL: http://localhost:4000
      AGENT_RT_WORKER_ID: uat
      AGENT_RT_PROVIDERS: fake-cli
      AGENT_RT_WORK_DIR: /tmp/uat-work
      AGENT_RT_LOG_DIR: /tmp/uat-logs
      RUNTIME_SANDBOX: "off"
      RUNTIME_ENV: development
      RUNTIME_SOURCE_CACHE_DIR: /tmp/uat-srccache
      HUB_SOURCE_LOCAL_ROOTS: /tmp
    volumes: [ "./app:/app" ]
    entrypoint: ["bash", "-c", "mkdir -p $$HOME /tmp/uat-work /tmp/uat-logs /tmp/uat-srccache && pip install -q --user uv && ~/.local/bin/uv sync --frozen && exec .venv/bin/python -m agent_runtime"]
    cpus: 1
    mem_limit: 2g
    init: true
volumes:
  uat-pgdata: