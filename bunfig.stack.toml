[install]
linker = "isolated"

[test]
# Bộ stack/hub-dev/smoke H2b, H2c (`tests/acceptance/{H2b,H2c}/{stack,hubdev}`, `tests/smoke`): chạy bằng
# `bun run test:h2b:stack`, `bun run test:h2c:stack`, bước H01 của `done:h2b`/`done:h2c`, `bun run test:smoke:live`.
# bunfig.toml + bunfig.int.toml bỏ các thư mục đó (L6) nên cần file riêng.
pathIgnorePatterns = ["e2e/**", "**/node_modules/**", "**/__fixtures__/**"]
