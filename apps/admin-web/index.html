<!doctype html>
<html lang="vi">
  <head>
    <!-- prefs-sync: apply remembered theme (default light) before first paint; key ai.theme shared by the 4 web apps -->
    <script>(() => { var d = document.documentElement, t = "light"; try { t = localStorage.getItem("ai.theme") || "light"; } catch {} var k = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches); d.classList.toggle("dark", k); d.dataset.theme = k ? "dark" : "light"; d.style.colorScheme = k ? "dark" : "light"; })();</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
