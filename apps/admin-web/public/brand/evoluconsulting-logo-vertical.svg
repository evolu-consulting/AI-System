<svg width="300" height="260" viewBox="0 0 300 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EvoluConsulting - Intelligent automation">
  <defs>
    <linearGradient id="evoluPurpleV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9B8FF"/>
      <stop offset="1" stop-color="#FFC2DD"/>
    </linearGradient>
    <mask id="evoluNotchV">
      <rect x="0" y="0" width="120" height="120" fill="white"/>
      <circle cx="110" cy="60" r="9" fill="black"/>
    </mask>
  </defs>

  <!-- Icon -->
  <g transform="translate(90,20)">
    <g mask="url(#evoluNotchV)">
      <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#evoluPurpleV)"/>
    </g>
    <g transform="translate(60,60)">
      <line x1="0" y1="-18" x2="-16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="0" y1="-18" x2="16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="-16" y1="13" x2="16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="-18" r="6.5" fill="white"/>
      <circle cx="-16" cy="13" r="5.5" fill="white"/>
      <circle cx="16" cy="13" r="5.5" fill="white"/>
      <circle cx="0" cy="2" r="2.6" fill="#6B4FA0"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="150" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#7C5CC4">Evolu</tspan><tspan fill="#2E2150">Consulting</tspan>
  </text>
  <text x="150" y="212" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="2.5" fill="#8E7BB5">INTELLIGENT AUTOMATION</text>
</svg>
