# HUB-FR-62 · Q8 · entitlement (tenant được dùng agent) + grant (user/group trong tenant). Tenant/user/group không tồn tại
# → bỏ mục đó + log cảnh báo, phần còn lại vẫn ghi. Group `beta-testers` do trigger Admin 0006 tạo cùng mọi tenant.
# one-agent · MỘT trợ lý `assistant` cho AI System + dock Sổ Hợp Tác (`mgmt-assistant` đã gộp, hub 0051).
entitlements:
  - agent: assistant
    tenant_key: acme
  - agent: assistant
    tenant_key: beta

grants:
  - agent: assistant
    tenant_key: acme
    subject: group:beta-testers
  - agent: assistant
    tenant_key: beta
    subject: group:beta-testers
  # M2-chat · ai có vai gói contracts (Group vai do Admin tạo khi bật gói) đều dùng được trợ lý; tool vẫn theo quyền + RLS.
  - agent: assistant
    tenant_key: acme
    subject: group:contracts-viewer
  - agent: assistant
    tenant_key: acme
    subject: group:contracts-editor
  - agent: assistant
    tenant_key: acme
    subject: group:contracts-owner
