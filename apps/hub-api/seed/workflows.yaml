# HUB-FR-23 · HUB-FR-95 · H2a plan-db §4: workflow Admin (key `CATALOG_KEY_RE`) mà agent `agentic-cli` được gọi làm tool MCP
# (`agent_workflows`, upsert, không xoá) + cờ `side_effect` cần người dùng xác nhận trước khi chạy (`workflow_flags`,
# chỉ bật, không tắt). Workflow chưa có trong `admin.workflows` → bỏ dòng + cảnh báo. Không chứa app-key/secret.
# Ví dụ (AC-H22):
#   agent_workflows:
#     - { agent: assistant, workflow: create-trello-card }
#   workflow_flags:
#     side_effect: [create-trello-card]
# LƯU Ý (X1): `workflow_flags.side_effect` KHÔNG còn hiệu lực — Hub đọc cột `admin.workflows.side_effect` (đặt qua Admin).
# HUB-FR-109 · SC-2: giai đoạn `ghi-so` (real_action) của mẫu `hoa-don` do agent `hoa-don-doc` chạy — gắn workflow Admin
# `ghi-so`. CR-081: agent `hoa-don-doc` là fixture opt-in ⇒ `agent_workflows` của nó chuyển sang `processes.full.yaml`
# (chỉ nạp khi HUB_SEED_FIXTURES=1), tránh tham chiếu agent không có trong seed tối giản.
agent_workflows: []
workflow_flags:
  side_effect: []
