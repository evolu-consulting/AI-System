# HUB-FR-60, HUB-FR-61 · provider + model profile (plan H1 §3.1, §3.6). Không chứa secret (H1-R16): `claude-sub` dùng
# đăng nhập CLI sẵn trên máy Runtime. `dev_only: true` → chỉ nạp khi APP_ENV ∈ {development, test}; ngoài đó step dùng
# provider bị bỏ cũng bị bỏ, profile hết step thì không nạp.
#
# ai-tiers-rag · bậc model (fast / std / deep). Dự phòng của profile là lúc GIAO job theo `provider_state` (HUB-FR-31,
# `pickStep`): bước i bị bỏ khi provider của nó đang chặn (cooldown ⇒ `quota`; logged_out/error ⇒ `error`) và trigger đó
# nằm trong `on` của bước i. Trạng thái đi theo PROVIDER, không theo model ⇒ mỗi model là một "làn" provider riêng của
# cùng gói Claude (`claude-sub` = sonnet, `claude-sub-haiku`, `claude-sub-opus`; Runtime tự claim làn khi có `claude-sub`).
# Model = alias CLI (`haiku`/`sonnet`/`opus`, CLI tự trỏ bản mới nhất — `hub.provider_models` liệt kê giá trị CLI nhận).
# Agent chọn bậc bằng `profile: $HUB_SEED_PROFILE:<bậc>` (seed.rules: claude-sub-1 ⇒ claude-sub-<bậc>; fake-1 ⇒ fake-1).
providers:
  - key: claude-sub
    kind: subscription
    vendor: anthropic
    max_concurrency: 2
  - key: claude-sub-haiku
    kind: subscription
    vendor: anthropic
    max_concurrency: 2
  - key: claude-sub-opus
    kind: subscription
    vendor: anthropic
    max_concurrency: 1
  - key: fake-cli
    kind: subscription
    vendor: fake
    max_concurrency: 2
    dev_only: true
  # H2a plan-db §4: Dify chạy agent `dify-*` + workflow.async. Không có key ở đây — app-key là secret của từng workflow
  # trong Admin (`admin.workflows.secret_id`), Hub/Runtime đọc lúc chạy. Không thuộc profile nào.
  - key: dify
    kind: api
    vendor: dify
    max_concurrency: 5

model_profiles:
  - key: claude-sub-1
    steps:
      - provider_key: claude-sub
        model: null
        on: []
  # Điều phối, câu ngắn: haiku; làn haiku hết hạn mức/lỗi ⇒ sonnet.
  - key: claude-sub-fast
    steps:
      - provider_key: claude-sub-haiku
        model: haiku
        on: [error, quota]
      - provider_key: claude-sub
        model: sonnet
        on: []
  # Trợ lý (tool hợp đồng / tri thức): sonnet; làn sonnet hết hạn mức ⇒ haiku.
  - key: claude-sub-std
    steps:
      - provider_key: claude-sub
        model: sonnet
        on: [quota]
      - provider_key: claude-sub-haiku
        model: haiku
        on: []
  # Việc nặng (đọc mã, rà soát): opus; làn opus hết hạn mức/lỗi ⇒ sonnet.
  - key: claude-sub-deep
    steps:
      - provider_key: claude-sub-opus
        model: opus
        on: [error, quota]
      - provider_key: claude-sub
        model: sonnet
        on: []
  - key: fake-1
    steps:
      - provider_key: fake-cli
        model: null
        on: []
