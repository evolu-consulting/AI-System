# HUB-FR-60, HUB-FR-61 · provider + model profile (plan H1 §3.1, §3.6). Không chứa secret (H1-R16): `claude-sub` dùng
# đăng nhập CLI sẵn trên máy Runtime. `dev_only: true` → chỉ nạp khi APP_ENV ∈ {development, test}; ngoài đó step dùng
# provider bị bỏ cũng bị bỏ, profile hết step thì không nạp.
providers:
  - key: claude-sub
    kind: subscription
    vendor: anthropic
    max_concurrency: 2
  - key: fake-cli
    kind: subscription
    vendor: fake
    max_concurrency: 2
    dev_only: true
  # H2a plan-db §4: Dify chạy agent `dify-*` + workflow.async. Không có key ở đây — app-key là secret của từng workflow
  # trong Admin (`admin.workflows.secret_id`), Hub/Runtime đọc lúc chạy. Không thuộc profile nào.
  - key: dify
    kind: api
    vendor: dify
    max_concurrency: 5

model_profiles:
  - key: claude-sub-1
    steps:
      - provider_key: claude-sub
        model: null
        on: []
  - key: fake-1
    steps:
      - provider_key: fake-cli
        model: null
        on: []
