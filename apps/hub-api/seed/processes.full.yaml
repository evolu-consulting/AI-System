          filename: bug.md
          template: "## Hiện tượng\n\n## Cách tái hiện\n\n## Mức ảnh hưởng\n\n## Bàn giao\n"
          required_sections: [Hiện tượng, Cách tái hiện, Mức ảnh hưởng]
        after: review
      - key: code-reading
        name: Đọc mã
        executor: { agent: backend-lead }
        instruction: "Khoanh vùng mã liên quan và nêu nguyên nhân gốc của lỗi."
        output:
          filename: code-reading.md
          template: "## Vị trí liên quan\n\n## Nguyên nhân gốc\n\n## Bàn giao\n"
          required_sections: [Vị trí liên quan, Nguyên nhân gốc]
        after: auto
      - key: bug-fix
        name: Sửa lỗi
        executor: { agent: backend-lead }
        instruction: "Sửa theo nguyên nhân gốc và thêm test hồi quy chặn lỗi tái diễn."
        output:
          filename: fix.md
          template: "## Thay đổi\n\n## Test hồi quy\n\n## Bàn giao\n"
          required_sections: [Thay đổi, Test hồi quy]
        after: auto
      - key: code-review
        name: Review mã
        executor: { agent: reviewer }
        instruction: "Review bản sửa; kết luận ĐẠT hoặc CẦN SỬA kèm việc phải sửa."
        output:
          filename: code-review.md
          template: "## Kết luận\n\n## Phát hiện\n\n## Việc phải sửa\n\n## Bàn giao\n"
          required_sections: [Kết luận, Phát hiện, Việc phải sửa]
        after: { review: { back_to_steps: [2] } }
      - key: testing
        name: Kiểm thử
        executor: { agent: qc }
        instruction: "Tái hiện lại lỗi trên bản sửa và chạy hồi quy; kết luận ĐẠT hoặc TRƯỢT."
        output:
          filename: test-report.md
          template: "## Kết luận\n\n## Ca đã chạy\n\n## Lỗi còn lại\n\n## Bàn giao\n"
          required_sections: [Kết luận, Ca đã chạy, Lỗi còn lại]
        after: { review: { back_to_steps: [2] } }
      - key: release
        name: Phát hành
        executor: { agent: docs-architect }
        instruction: "Ghi chú phát hành bản sửa và việc cần theo dõi sau phát hành."
        output:
          filename: release.md
          template: "## Ghi chú phát hành\n\n## Theo dõi sau phát hành\n\n## Bàn giao\n"
          required_sections: [Ghi chú phát hành, Theo dõi sau phát hành]
        after: auto
  # P-c1 B6 (HUB-FR-130, plan §6.1) · tự sửa mã trong container không mạng, người duyệt diff. Tắt sẵn; `autofix.source_key`
  # là key tĩnh ⇒ tenant_admin đổi `repo` sang key nguồn git/local của mình khi chép (giống P-b).
