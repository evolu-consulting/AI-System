<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EvoluConsulting - Intelligent automation">
  <defs>
    <linearGradient id="evoluPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <mask id="evoluNotch">
      <rect x="0" y="0" width="120" height="120" fill="white"/>
      <circle cx="110" cy="60" r="9" fill="black"/>
    </mask>
  </defs>

  <!-- Icon: neural network -->
  <g transform="translate(20,20)">
    <g mask="url(#evoluNotch)">
      <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#evoluPurple)"/>
    </g>
    <g transform="translate(60,60)">
      <line x1="0" y1="-18" x2="-16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="0" y1="-18" x2="16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="-16" y1="13" x2="16" y2="13" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="-18" r="6.5" fill="white"/>
      <circle cx="-16" cy="13" r="5.5" fill="white"/>
      <circle cx="16" cy="13" r="5.5" fill="white"/>
      <circle cx="0" cy="2" r="2.6" fill="#4F46E5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="164" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#6366F1">Evolu</tspan><tspan fill="#1E1B4B">Consulting</tspan>
  </text>
  <text x="165" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" letter-spacing="2.5" fill="#6B6B8A">INTELLIGENT AUTOMATION</text>
</svg>
