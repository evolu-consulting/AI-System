# tool-evotest-cache: fail-fast stack e2e (chi hoat dong khi test-e2e-par dat E2E_FAILFAST=1 va script la e2e/**/_*.ts; xem tools/scripts/src/e2e-failfast.ts)
preload = ["./tools/scripts/src/e2e-failfast.ts"]

[install]
# Ghi tường minh: gốc repo chỉ thấy dependency khai ở package.json gốc (plan.md R8).
linker = "isolated"

[test]
# e2e chạy bằng Playwright, test tích hợp chạy bằng `bun run test:int` (bunfig.int.toml).
pathIgnorePatterns = ["e2e/**", "spikes/**", "**/*.int.test.ts", "tests/contract/**", "**/node_modules/**", "**/__fixtures__/**", "tests/acceptance/H1/stack/**", "tests/acceptance/H2a/stack/**", "tests/acceptance/H2b/stack/**", "tests/acceptance/H2b/hubdev/**", "tests/acceptance/H2c/stack/**", "tests/acceptance/H3a/stack/**", "tests/acceptance/H3b-cmd/**", "tests/acceptance/H2c/hubdev/**", "tests/smoke/**", "tests/acceptance/P-b/pfs2/**"]
