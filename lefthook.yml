# Pre-commit (CONVENTIONS §1): biome tự sửa format/import của file đã stage rồi stage lại (stage_fixed);
# lỗi lint không tự sửa được ⇒ vẫn chặn commit. Chỉ đụng file đã stage (không `--changed`).
pre-commit:
  jobs:
    - name: biome
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: check-size
      run: bun tools/scripts/src/check-size.ts --files {staged_files}
    - name: depcruise-affected
      glob: "*.{ts,tsx}"
      run: bun tools/scripts/src/depcruise.ts --affected
    - name: check-case
      run: bun tools/scripts/src/check-case.ts
    - name: check-boundaries
      glob: "apps/hub-api/src/**"
      run: bun tools/scripts/src/check-boundaries.ts
    - name: check-app-slots
      glob: "packages/contracts/src/app-manifest/**"
      run: bun tools/scripts/src/check-app-slots.ts
    - name: check-modules
      glob: "packages/contracts/src/modules/**"
      run: bun tools/scripts/src/check-modules.ts
