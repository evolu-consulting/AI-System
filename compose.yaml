# ADM-NFR-06 · hạ tầng dev (spec M0 §7). Chỉ dịch vụ có trạng thái; mock chạy bằng `bun run mocks`.
# Lệnh chuẩn: `docker compose up -d --wait` (chờ healthy).
# Cổng chỉ bind 127.0.0.1 (mật khẩu dev cố định, không mở ra LAN).
name: ai-system

services:
  postgres:
    image: postgres:16.15-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev_pw
      POSTGRES_DB: ai_system
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ai", "-d", "ai_system"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redisdata:/data

  # CR-114 hub-otel · tracing dev, CHỈ khi `docker compose --profile otel up -d` (mặc định không chạy, không ảnh hưởng
  # `docker compose up --wait`). Bật tracing: đặt OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 cho hub-api + runtime;
  # xem trace ở http://127.0.0.1:16686 (Jaeger). Xem docs/WORKFLOW.md "Tracing và log kv".
  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: ["otel"]
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

volumes:
  pgdata:
  redisdata:
