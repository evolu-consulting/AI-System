# sohoptac2 - edge-proxy: 4 hostnames (prod + alias -test; names via __N_*__, rendered by edge-lib.sh) -> container sohoptac2-web-1 (project sohoptac2's own nginx) by internal port.
# enable-domain.sh copies this file to edge-proxy/conf.d/sohoptac2.conf (touches no other conf) and replaces __BASE__ with the base domain.
# TLS is terminated by the host nginx (wildcard cert); edge-proxy receives plain HTTP. The `web` container already routes /auth, /admin,
# Hub, /_fb and the SPA per port, so this only forwards. `set $upstream` + resolver 127.0.0.11 keeps nginx alive when the sohoptac2
# containers are down (502 instead of a failed reload). Map names are prefixed s2_ to avoid clashing with other apps in the same http{}.
map $http_upgrade $s2_conn_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $s2_proto { default $http_x_forwarded_proto; '' $scheme; }

# ai-test = AI System portal + Chat AI (chat-web)
server {
    listen 80;
    server_name __N_CHAT__;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 110m;
    location / {
        set $upstream sohoptac2-web-1:8083;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $s2_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s2_conn_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}

