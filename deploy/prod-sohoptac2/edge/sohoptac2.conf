}

# sohoptac.<d> (host cu; CR-119: 301 -> app.<d> khi S2_APP_HOST_LIVE=1) = So Hop Tac + Community (sohoptac-web gop; Community o /community/*, history fallback do nginx `web` cong 8081 lo)
server {
    listen 80;
    server_name __N_CONTRACTS__;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 110m;
    location / {
        if ($s2_legacy_to) { add_header Cache-Control "max-age=86400" always; return 301 $s2_legacy_to$request_uri; }
        set $upstream sohoptac2-web-1:8081;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $s2_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s2_conn_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}

