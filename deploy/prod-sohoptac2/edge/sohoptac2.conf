# sohoptac2 - edge-proxy: 4 hostnames (app/app-test = web gop, CR-119; sohoptac[-test] va community[-test] da bo 2026-11-05) (prod + alias -test; names via __N_*__, rendered by edge-lib.sh) -> container sohoptac2-web-1 (project sohoptac2's own nginx) by internal port.
# enable-domain.sh copies this file to edge-proxy/conf.d/sohoptac2.conf (touches no other conf) and replaces __BASE__ with the base domain.
# TLS is terminated by the host nginx (wildcard cert); edge-proxy receives plain HTTP. The `web` container already routes /auth, /admin,
# Hub, /_fb and the SPA per port, so this only forwards. `set $upstream` + resolver 127.0.0.11 keeps nginx alive when the sohoptac2
# containers are down (502 instead of a failed reload). Map names are prefixed s2_ to avoid clashing with other apps in the same http{}.
map $http_upgrade $s2_conn_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $s2_proto { default $http_x_forwarded_proto; '' $scheme; }
map $request_uri $s2_log_normal { ~^/partner-reply/ 0; default 1; }
map $request_uri $s2_log_partner { ~^/partner-reply/ 1; default 0; }
# CR-124 q5: /partner-reply/<token> mang token bí mật ⇒ không ghi URI đầy đủ vào access log.
log_format s2_partner_rt '$remote_addr - - [$time_local] "$request_method /partner-reply/:token" $status $body_bytes_sent "-" "$http_user_agent"';

# ai-test = AI System portal + Chat AI (chat-web)
server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$s2_log_normal;
    access_log /var/log/nginx/access.log s2_partner_rt if=$s2_log_partner;
    server_name __N_CHAT__;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 110m;
    location / {
        set $upstream sohoptac2-web-1:8083;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $s2_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s2_conn_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}

