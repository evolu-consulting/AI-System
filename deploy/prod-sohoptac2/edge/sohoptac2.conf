# community.<d> CU (CR-118): Cong dong da nam trong web gop (sohoptac.<d>/community). Server nay chi forward toi cong 8085 cua `web`, noi nginx tra 301
# ve https://sohoptac.<d>/community (HTML) va giu proxy /auth,/pack,/me/stream 30 ngay cho tab cu (xem nginx.conf). Sau moc do co the go server nay + __N_COMMUNITY__.
# Đích 301 từ domain cấu hình (không từ Host client): web nginx 8085 đọc header X-S2-Main-Origin do edge đặt (rỗng ⇒ header bị xoá).
map $host $s2_cm_main { default ""; community.__BASE__ __MAIN_PROD__; community-test.__BASE__ __MAIN_TEST__; }
server {
    listen 80;
    server_name __N_COMMUNITY__;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 110m;
    location / {
        set $upstream sohoptac2-web-1:8085;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-S2-Main-Origin $s2_cm_main;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $s2_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s2_conn_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}
