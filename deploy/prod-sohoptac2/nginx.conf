# sohoptac2 web: mỗi web một cổng (8081–8085 trong container, publish 127.0.0.1:18431–18435; 8085 = chỉ 301 community.<d> → /community, CR-118). Quy tắc proxy chép đúng
# rsbuild.config.ts của từng web (cùng origin ⇒ cookie refresh SameSite=Strict chạy). HTTPS/tên miền = bước public sau.
resolver 127.0.0.11 valid=30s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Giu https khi edge-proxy (domain) bao x-forwarded-proto; qua tunnel/truc tiep thi dung scheme cua ket noi.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

# --- sohoptac-web (web gộp: Sổ Hợp Tác + Community /community/*; host chính sohoptac.<d>) ---
# CR-118: route SPA của Community nằm dưới /community/* (và /community/profile/<org>/<section>) — KHÔNG trùng tiền tố API nào bên dưới nên rơi vào
# `location /` (try_files … /index.html = history fallback). /me/stream (SSE: thẻ duyệt + config.changed) đi tới hub-api.
server {
    listen 8081;
    root /srv/contracts;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    location /admin/ { proxy_pass $auth; }
    location = /admin { proxy_pass $auth; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    location ~ ^/(pack|conversations|runs|hub-admin|tenants)(/|$) {
        proxy_pass $hub;
    }
    location = /me/stream { proxy_pass $hub; }
    # /notifications: vừa là API hub vừa là route SPA (gap-c) — trình duyệt mở/tải lại trang (GET, Accept text/html) nhận index.html.
    location ~ ^/notifications(/|$) {
        set $spa "";
        if ($request_method = GET) { set $spa "G"; }
        if ($http_accept ~* "text/html") { set $spa "${spa}H"; }
        if ($spa = "GH") { rewrite ^ /index.html last; }
        proxy_pass $hub;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- admin-web ---
server {
    listen 8082;
    root /srv/admin;
    set $auth http://admin-api:3001;
    set $hub http://hub-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    # gap-c #35: chuông thông báo dùng chung gọi /notifications của hub-api (cùng origin).
    location ~ ^/notifications(/|$) { proxy_pass $hub; }
    location /admin/ { proxy_pass $auth; }
    location = /admin { proxy_pass $auth; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- chat-web ---
server {
    listen 8083;
    root /srv/chat;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    location ~ ^/(conversations|processes|process-runs|review-tasks|agents|commands|attachments|dlc|health|pack|notifications)(/|$) { proxy_pass $hub; }
    # /runs /rooms /directory /me: vừa là API vừa là route SPA — trình duyệt mở trang (GET, Accept text/html) nhận index.html.
    location ~ ^/(runs|rooms|directory|me)(/|$) {
        set $spa "";
        if ($request_method = GET) { set $spa "G"; }
        if ($http_accept ~* "text/html") { set $spa "${spa}H"; }
        if ($spa = "GH") { rewrite ^ /index.html last; }
        proxy_pass $hub;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- hub: Hub API + Studio (/studio, do hub-api phục vụ từ HUB_STUDIO_DIST) ---
server {
    listen 8084;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    location = /auth-health { proxy_pass $auth/health; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    # Trang gốc không có route ở hub-api ⇒ chuyển sang Studio (tránh 404 trống khi gõ tên miền).
    # absolute_redirect off ⇒ Location tương đối (không lộ http + cổng nội bộ 8084 sau edge-proxy https).
    absolute_redirect off;
    location = / { return 302 /studio/; }
    location / { proxy_pass $hub; }
}

# --- community.<d> cũ (CR-118): 301 về web gộp; proxy API giữ 30 ngày cho tab đang mở ---
# Host cũ community.<d> (cổng 8085) KHÔNG còn SPA riêng. Điều hướng HTML (GET/HEAD) → 301 https://sohoptac.<d>/community (fragment #/… do trình duyệt
# giữ; web gộp ánh xạ hash cũ #/feed, #/profile/<o>/<s>, #/settings bằng legacy-hash.ts). community-test.<d> → sohoptac-test.<d>. Host khác
# (tunnel localhost:18435) → http://localhost:18431/community (cổng publish − 4, xem map). Chỉ `/` và `/sso` có đích riêng; mọi đường dẫn HTML lạ về /community (route SPA cũ dùng hash).
# Cache-Control: max-age=86400 giới hạn thời gian trình duyệt nhớ 301 (rollback: xem README "CR-118 rollout/rollback").
# GIỮ CÁC proxy /auth, /pack, /conversations, /runs, /notifications, /me/stream dưới đây tới 2026-12-05 (= 30 ngày sau ngày deploy dự kiến 2026-11-05;
# ĐỔI mốc này thành ngày deploy thật + 30 ngày khi deploy) để tab Community đang mở (bundle cũ, cookie ai_rt_community Path=/auth) không gãy; sau mốc
# đó gỡ các location proxy, chỉ để 301 (hoặc gỡ hẳn server + __N_COMMUNITY__ ở edge sau khi log truy cập về ~0).
# Tunnel/stg (host:cổng kết thúc bằng 5): cổng Sổ Hợp Tác = cổng 8085 đã publish trừ 4 (18435→18431, 28535→28531) — giữ UAT stg khỏi nhảy sang cổng prod.
# Đích 301 KHÔNG lấy từ Host của client (301 bị cache 1 ngày): (1) qua edge-proxy, edge ĐẶT header X-S2-Main-Origin từ domain cấu hình
# (edge/sohoptac2.conf map $s2_cm_main, __BASE__ do enable-domain.sh điền; header rỗng thì bị xoá ⇒ client không giả được); (2) tunnel/stg 127.0.0.1|localhost:…5 → …1;
# (3) còn lại cố định localhost:18431.
map $http_host $s2_main_fallback {
    default http://localhost:18431;
    ~^(?<hh>127\.0\.0\.1|localhost):(?<pre>\d*)5$ http://$hh:${pre}1;
}
map $http_x_s2_main_origin $s2_main_origin {
    default $s2_main_fallback;
    ~^https://sohoptac(-test)?\.[a-z0-9.-]+$ $http_x_s2_main_origin;
}
server {
    listen 8085;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    # --- proxy giữ 30 ngày (xem mốc ở trên) ---
    location /auth/ { proxy_pass $auth; }
    location ~ ^/(pack|conversations|runs)(/|$) { proxy_pass $hub; }
    location = /me/stream { proxy_pass $hub; }
    # --- hết proxy giữ 30 ngày ---
    # Điều hướng trình duyệt tới /notifications (GET, Accept text/html) cũng 301; gọi API (không html) vẫn tới hub-api (chuông của tab cũ).
    location ~ ^/notifications(/|$) {
        set $spa "";
        if ($request_method = GET) { set $spa "G"; }
        if ($http_accept ~* "text/html") { set $spa "${spa}H"; }
        if ($spa = "GH") { return 301 $s2_main_origin/community; }
        proxy_pass $hub;
    }
    location = /sso { add_header Cache-Control "max-age=86400" always; return 301 $s2_main_origin/sso$is_args$args; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control "max-age=86400" always;
        return 301 $s2_main_origin/community;
    }
}
