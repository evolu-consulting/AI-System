# sohoptac2 web: mỗi web một cổng (8081–8084 trong container, publish 127.0.0.1:18431–18434; CR-119: bỏ cổng 8085/community.<d> cũ). Quy tắc proxy chép đúng
# rsbuild.config.ts của từng web (cùng origin ⇒ cookie refresh SameSite=Strict chạy). HTTPS/tên miền = bước public sau.
resolver 127.0.0.11 valid=30s ipv6=off;
# CR-117: access log = định dạng `combined` (giữ nguyên các trường đầu để parser cũ vẫn chạy) + `rt=$request_time urt=$upstream_response_time` (giây).
# Tên `main_rt` (không đè `combined` có sẵn). Ra stdout của container `web`; ops-slo-status.sh tính p95 contracts.list từ đây (tools/scripts/src/slo-routes.rules.ts).
log_format main_rt '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
# CR-124 q5: đường /partner-reply/<token> mang token bí mật ⇒ KHÔNG ghi URI đầy đủ; dòng riêng chỉ ghi `/partner-reply/:token` (cùng trường với main_rt trừ referer).
map $request_uri $log_normal { ~^/partner-reply/ 0; default 1; }
map $request_uri $log_partner { ~^/partner-reply/ 1; default 0; }
log_format partner_rt '$remote_addr - - [$time_local] "$request_method /partner-reply/:token" $status $body_bytes_sent "-" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
access_log /dev/stdout main_rt if=$log_normal;
access_log /dev/stdout partner_rt if=$log_partner;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Giu https khi edge-proxy (domain) bao x-forwarded-proto; qua tunnel/truc tiep thi dung scheme cua ket noi.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

# --- workspace-web (web gộp: Sổ Hợp Tác + Community /community/*; host duy nhất app.<d>; sohoptac.<d> đã bỏ 2026-11-05) ---
# CR-119 p2: SHT nằm dưới /contracts/* (route SPA, KHÔNG phải API: API hợp đồng là /pack/contracts/*) và vẫn rơi vào `location /`; /notifications giữ
# vai API + route SPA cũ (legacy redirect của web đưa về /contracts/notifications). Test: apps/workspace-web/scripts/deploy-proxy.test.ts.
# CR-118: route SPA của Community nằm dưới /community/* (và /community/profile/<org>/<section>) — KHÔNG trùng tiền tố API nào bên dưới nên rơi vào
# `location /` (try_files … /index.html = history fallback). /me/stream (SSE: thẻ duyệt + config.changed) đi tới hub-api.
server {
    listen 8081;
    root /srv/contracts;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    location /admin/ { proxy_pass $auth; }
    location = /admin { proxy_pass $auth; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    # CR-124 q5: trang công khai trả lời hợp đồng qua link email (HUB_NOTIFY_BASE_URL = host app này); không JWT, hub tự kiểm token.
    location ~ ^/partner-reply/ { proxy_pass $hub; }
    location ~ ^/(pack|conversations|runs|hub-admin|tenants)(/|$) {
        proxy_pass $hub;
    }
    # CR-125 cr125-manual-start-ui: «Tạo yêu cầu» (phiếu bắt đầu quy trình, tệp đính kèm, việc chờ tôi + quyết định) — API hub, không phải route SPA.
    location ~ ^/(processes|attachments|review-tasks)(/|$) { proxy_pass $hub; }
    location = /me/review-tasks { proxy_pass $hub; }
    location = /me/stream { proxy_pass $hub; }
    # /notifications: vừa là API hub vừa là route SPA (gap-c) — trình duyệt mở/tải lại trang (GET, Accept text/html) nhận index.html.
    location ~ ^/notifications(/|$) {
        set $spa "";
        if ($request_method = GET) { set $spa "G"; }
        if ($http_accept ~* "text/html") { set $spa "${spa}H"; }
        if ($spa = "GH") { rewrite ^ /index.html last; }
        proxy_pass $hub;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- admin-web ---
server {
    listen 8082;
    root /srv/admin;
    set $auth http://admin-api:3001;
    set $hub http://hub-api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    # gap-c #35: chuông thông báo dùng chung gọi /notifications của hub-api (cùng origin).
    location ~ ^/notifications(/|$) { proxy_pass $hub; }
    location /admin/ { proxy_pass $auth; }
    location = /admin { proxy_pass $auth; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- chat-web ---
server {
    listen 8083;
    root /srv/chat;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    location ~ ^/(conversations|processes|process-runs|review-tasks|agents|commands|attachments|dlc|health|pack|notifications)(/|$) { proxy_pass $hub; }
    # /runs /rooms /directory /me: vừa là API vừa là route SPA — trình duyệt mở trang (GET, Accept text/html) nhận index.html.
    location ~ ^/(runs|rooms|directory|me)(/|$) {
        set $spa "";
        if ($request_method = GET) { set $spa "G"; }
        if ($http_accept ~* "text/html") { set $spa "${spa}H"; }
        if ($spa = "GH") { rewrite ^ /index.html last; }
        proxy_pass $hub;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- hub: Hub API + Studio (/studio, do hub-api phục vụ từ HUB_STUDIO_DIST) ---
server {
    listen 8084;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    location = /auth-health { proxy_pass $auth/health; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    # Trang gốc không có route ở hub-api ⇒ chuyển sang Studio (tránh 404 trống khi gõ tên miền).
    # absolute_redirect off ⇒ Location tương đối (không lộ http + cổng nội bộ 8084 sau edge-proxy https).
    absolute_redirect off;
    location = / { return 302 /studio/; }
    location / { proxy_pass $hub; }
}
