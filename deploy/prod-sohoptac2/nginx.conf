# sohoptac2 web: mỗi web một cổng (8081–8084 trong container, publish 127.0.0.1:18431–18434). Quy tắc proxy chép đúng
# rsbuild.config.ts của từng web (cùng origin ⇒ cookie refresh SameSite=Strict chạy). HTTPS/tên miền = bước public sau.
resolver 127.0.0.11 valid=30s ipv6=off;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- contracts-web (Sổ Hợp Tác) ---
server {
    listen 8081;
    root /srv/contracts;
    client_max_body_size 110m;
    set $hub http://hub-api:4000;
    set $auth http://admin-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_pass_header X-Accel-Buffering;
    proxy_read_timeout 600;
    location /auth/ { proxy_pass $auth; }
    location /admin/ { proxy_pass $auth; }
    location = /admin { proxy_pass $auth; }
    # Link tải FileBox riêng (đã ký, 10 phút): chỉ GET/HEAD /_fb/d/<id>; FileBox không có cổng host, nginx là đường duy nhất ra trình duyệt.
    location ~ ^/_fb/(d/[0-9a-f]+)$ {
        limit_except GET HEAD { deny all; }
        set $fb http://filebox:9100;
        proxy_pass $fb/$1$is_args$args;
    }
    location ~ ^/(pack|notifications|conversations|runs)(/|$) {
        proxy_pass $hub;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

