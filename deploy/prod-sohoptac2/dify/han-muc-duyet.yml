app:
  description: Tra cuu cap duyet hop dong theo han muc (chinh sach demo QC-TC-01). Khong dung LLM, khong can model provider.
  icon: "\U0001F4DC"
  icon_background: '#FFEAD5'
  mode: workflow
  name: "Kiểm tra hạn mức duyệt hợp đồng"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: hmd-start-source-hmd-code-target
      source: hmd-start
      sourceHandle: source
      target: hmd-code
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: hmd-code-source-hmd-end-target
      source: hmd-code
      sourceHandle: source
      target: hmd-end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: "Start"
        type: start
        variables:
        - label: contract_value
          max_length: 48
          options: []
          required: true
          type: number
          variable: contract_value
        - label: contract_type
          max_length: 48
          options:
          - Mua
          - "B\xE1n"
          - "Giới thiệu"
          required: true
          type: select
          variable: contract_type
        - label: partner_name
          max_length: 200
          options: []
          required: false
          type: text-input
          variable: partner_name
      height: 116
      id: hmd-start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |2

          def main(contract_value, contract_type, partner_name) -> dict:
              # Chinh sach demo QC-TC-01 (gia tri hop dong, VND):
              #   duoi 50tr: Truong phong Kinh doanh
              #   50-500tr : + Ke toan truong
              #   tren 500tr: + Giam doc ky
              #   tren 2 ty: + y kien Phong Phap che
              try:
                  v = float(contract_value)
              except (TypeError, ValueError):
                  v = -1.0
              kind = str(contract_type or "").strip()
              partner = str(partner_name or "").strip()
              if v <= 0:
                  return {
                      "approvers": [],
                      "level": "Khong hop le",
                      "note": "Giá trị hợp đồng phải lớn hơn 0 (VND).",
                  }
              TR = 1000000
              approvers = ["Trưởng phòng Kinh doanh"]
              level = "Cấp 1 - Trưởng phòng"
              if v >= 50 * TR:
                  approvers.append("Kế toán trưởng")
                  level = "Cấp 2 - Kế toán trưởng"
              if v > 500 * TR:
                  approvers.append("Giám đốc ký")
                  level = "Cấp 3 - Giám đốc"
              if v > 2000 * TR:
                  approvers.append("Ý kiến Phòng Pháp chế")
                  level = "Cấp 4 - Giám đốc + Pháp chế"
              amount = "{:,.0f}".format(v).replace(",", ".")
              who = " (" + partner + ")" if partner else ""
              steps = "; ".join(str(i + 1) + ") " + a for i, a in enumerate(approvers))
              note = (
                  "Hợp đồng " + kind + who + " trị giá " + amount + " đ - " + level
                  + ". Chuỗi duyệt: " + steps + "."
              )
              return {"approvers": approvers, "level": level, "note": note}
        code_language: python3
        desc: ''
        outputs:
          approvers:
            children: null
            type: array[string]
          level:
            children: null
            type: string
          note:
            children: null
            type: string
        selected: false
        title: "Ap dung han muc QC-TC-01"
        type: code
        variables:
        - value_selector:
          - hmd-start
          - contract_value
          variable: contract_value
        - value_selector:
          - hmd-start
          - contract_type
          variable: contract_type
        - value_selector:
          - hmd-start
          - partner_name
          variable: partner_name
      height: 54
      id: hmd-code
      position:
        x: 400
        y: 282
      positionAbsolute:
        x: 400
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - hmd-code
          - approvers
          variable: approvers
        - value_selector:
          - hmd-code
          - level
          variable: level
        - value_selector:
          - hmd-code
          - note
          variable: note
        selected: false
        title: "End"
        type: end
      height: 116
      id: hmd-end
      position:
        x: 720
        y: 282
      positionAbsolute:
        x: 720
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
