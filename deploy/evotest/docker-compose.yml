# Test runner từ xa cho evolu-platform (deploy/evotest/run-tests.ps1) - project Docker RIÊNG "evotest" trên máy chủ production.
# Không `ports:`, không gắn mạng nào có sẵn (mạng mặc định của project), Postgres ở tmpfs (không volume cần dọn).
# Nhiều slot song song: mỗi slot = project riêng `-p evotest-sN` (remote.sh), thư mục riêng ~/workspace/evotest/slots/sN, không container_name cố định.
# Ngân sách MỖI slot (máy chủ 12 CPU / 125 GB RAM, ~70 GB trống): CPU trần 2 + 1 + 0.25 = 3.25; RAM 6 + 5 + 0.5 = 11.5 GB.
# 4 slot = 13 CPU trần (mềm nhờ cpu_shares 128 + `nice -n 19`), 46 GB RAM.
name: evotest

x-runner: &runner
  user: "${EVO_UID:-1002}:${EVO_GID:-1002}"
  working_dir: /app
  environment:
    HOME: /tmp/evohome
    BUN_INSTALL_CACHE_DIR: /cache
    EVO_STEP: ${EVO_STEP:-unit}
    EVO_FILTER: ${EVO_FILTER:-}
    EVO_WORKERS: ${EVO_WORKERS:-}
    EVO_ALL: ${EVO_ALL:-}
    EVO_CAPTURE: ${EVO_CAPTURE:-}
  volumes:
    - ./app:/app
    - ${EVO_CACHE:-./cache}:/cache
    - ./out:/out
    - ./in-container.sh:/in-container.sh:ro
  depends_on:
    pg: { condition: service_healthy }
    redis: { condition: service_healthy }
  entrypoint: ["nice", "-n", "19", "bash", "/in-container.sh"]
  cpus: 2
  mem_limit: 6g
  cpu_shares: 128
  shm_size: 1g
  init: true

services:
  pg:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev_pw
      POSTGRES_DB: ai_system
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_system"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data:size=3g
    cpus: 1
    mem_limit: 5g
    cpu_shares: 128

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    cpus: 0.25
    mem_limit: 512m
    cpu_shares: 128

  runner:
    <<: *runner
    image: evotest-runner:bun-1.3.14
    build: { context: ., dockerfile: Dockerfile, target: runner }

  runner-e2e:
    <<: *runner
    image: evotest-runner-e2e:pw-1.63.0
    build: { context: ., dockerfile: Dockerfile, target: e2e }
    profiles: ["e2e"]
