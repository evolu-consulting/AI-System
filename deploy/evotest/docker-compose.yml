# Test runner từ xa cho evolu-platform (deploy/evotest/run-tests.ps1) - project Docker RIÊNG "evotest" trên máy chủ production.
# Không `ports:`, không gắn mạng nào có sẵn (mạng mặc định của project), Postgres ở tmpfs (không volume cần dọn).
# Ngân sách cứng: CPU 2 + 0.5 + 3.5 = 6; RAM 8 + 1 + 14 = 23 GB (<= 24). cpu_shares thấp + `nice -n 19` trong lệnh chạy.
name: evotest

x-runner: &runner
  user: "${EVO_UID:-1002}:${EVO_GID:-1002}"
  working_dir: /app
  environment:
    HOME: /tmp/evohome
    BUN_INSTALL_CACHE_DIR: /cache
    EVO_STEP: ${EVO_STEP:-unit}
    EVO_FILTER: ${EVO_FILTER:-}
    EVO_WORKERS: ${EVO_WORKERS:-}
    EVO_ALL: ${EVO_ALL:-}
    EVO_CAPTURE: ${EVO_CAPTURE:-}
  volumes:
    - ./app:/app
    - ./cache:/cache
    - ./out:/out
    - ./in-container.sh:/in-container.sh:ro
  depends_on:
    pg: { condition: service_healthy }
    redis: { condition: service_healthy }
  entrypoint: ["nice", "-n", "19", "bash", "/in-container.sh"]
  cpus: 3.5
  mem_limit: 14g
  cpu_shares: 128
  shm_size: 1g
  init: true

services:
  pg:
    image: postgres:16.15-alpine
    container_name: evotest-pg
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev_pw
      POSTGRES_DB: ai_system
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=1GB", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_system"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data:size=6g
    cpus: 2
    mem_limit: 8g
    cpu_shares: 128

  redis:
    image: redis:7.4.11-alpine
    container_name: evotest-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    cpus: 0.5
    mem_limit: 1g
    cpu_shares: 128

  runner:
    <<: *runner
    container_name: evotest-runner
    image: evotest-runner:bun-1.3.14
    build: { context: ., dockerfile: Dockerfile, target: runner }

  runner-e2e:
    <<: *runner
    container_name: evotest-runner-e2e
    image: evotest-runner-e2e:pw-1.63.0
    build: { context: ., dockerfile: Dockerfile, target: e2e }
    profiles: ["e2e"]
