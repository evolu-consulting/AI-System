# Test runner từ xa cho evolu-platform (deploy/evotest/run-tests.ps1) - project Docker RIÊNG "evotest" trên máy chủ production.
# Không `ports:`, không gắn mạng nào có sẵn (mạng mặc định của project), Postgres ở tmpfs (không volume cần dọn).
# Nhiều slot song song: mỗi slot = project riêng `-p evotest-sN` (remote.sh), thư mục riêng ~/workspace/evotest/slots/sN, không container_name cố định.
# Ngân sách MỖI slot (máy chủ 12 CPU / 125 GB RAM, ~106 GB trống; prod sohoptac2 + dự án khác cùng máy): CPU trần 2 + 1 + 0.25 = 3.25; RAM trần 5 + 4 + 0.25 = 9.25 GB.
# 8 slot = 26 CPU trần (mềm: cpu_shares 128 so với 1024 mặc định của prod + `nice -n 19`), 74 GB RAM trần (~59% RAM; dùng thật thấp hơn nhiều).
name: evotest

x-runner: &runner
  user: "${EVO_UID:-1002}:${EVO_GID:-1002}"
  working_dir: /app
  environment:
    HOME: /tmp/evohome
    BUN_INSTALL_CACHE_DIR: /cache
    EVO_STEP: ${EVO_STEP:-unit}
    EVO_FILTER: ${EVO_FILTER:-}
    EVO_PROBE: ${EVO_PROBE:-}
    EVO_WORKERS: ${EVO_WORKERS:-}
    EVO_JOBS: ${EVO_JOBS:-}
    EVO_ALL: ${EVO_ALL:-}
    EVO_CAPTURE: ${EVO_CAPTURE:-}
    # tool-evotest-cache: cache dựng web dùng chung mọi slot (cùng volume /cache với bun cache). `-NoCache` ⇒ EVO_BUILD_CACHE_ON rỗng ⇒ dựng như cũ.
    EVO_BUILD_CACHE: ${EVO_BUILD_CACHE_ON-/cache/build}
  volumes:
    - ./app:/app
    - ${EVO_CACHE:-./cache}:/cache
    - ./out:/out
    - ./in-container.sh:/in-container.sh:ro
  depends_on:
    pg: { condition: service_healthy }
    redis: { condition: service_healthy }
  entrypoint: ["nice", "-n", "19", "bash", "/in-container.sh"]
  # tool-evotest-cache: lượt toàn bộ chia slot (run-tests.ps1) nâng CPU/RAM mỗi slot theo lõi máy chủ; mặc định như cũ (2 CPU / 6 GB).
  cpus: ${EVO_RUNNER_CPUS:-2}
  mem_limit: ${EVO_RUNNER_MEM:-6g}
  cpu_shares: 128
  shm_size: 1g
  init: true

services:
  pg:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev_pw
      POSTGRES_DB: ai_system
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_system"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data:size=3g
    cpus: ${EVO_PG_CPUS:-1}
    mem_limit: 4g
    cpu_shares: 128

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    cpus: 0.25
    mem_limit: 256m
    cpu_shares: 128

  runner:
    <<: *runner
    image: evotest-runner:bun-1.3.14
    build: { context: ., dockerfile: Dockerfile, target: runner }

  runner-e2e:
    <<: *runner
    image: evotest-runner-e2e:pw-1.63.0
    build: { context: ., dockerfile: Dockerfile, target: e2e }
    profiles: ["e2e"]

  # Bước `py` (run-tests.ps1 -Step py): pytest agent-runtime (unit + int) với PG/Redis của slot; không chạy trong `all`.
  runner-py:
    <<: *runner
    image: evotest-runner-py:uv-py3.12-bun-1.3.14
    build: { context: ., dockerfile: Dockerfile, target: py }
    profiles: ["py"]
