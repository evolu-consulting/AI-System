# Staging spike ADR-0017 (docs/platform/spike-engine.md) — project RIÊNG "evostaging", tách hẳn project "aisystem".
# Không mở cổng ra ngoài (không `ports:`), mạng nội bộ riêng, giới hạn CPU/RAM để không ảnh hưởng hệ thống đang chạy.
# Chạy bởi deploy/staging/run-spike.ps1; xong thì `docker compose -p evostaging down -v` (xoá cả dữ liệu).
name: evostaging

services:
  pg:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_dev_pw
      POSTGRES_DB: ai_system
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_system"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    cpus: 2
    mem_limit: 2g

  redis:
    image: redis:7.4.11-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    cpus: 1
    mem_limit: 512m

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LOAD_N: ${LOAD_N:-10000}
      SPIKE_OUT: /out
    volumes:
      - ./out:/out
    depends_on:
      pg: { condition: service_healthy }
      redis: { condition: service_healthy }
    cpus: 2
    mem_limit: 3g
