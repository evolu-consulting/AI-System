# CR-159 · tenant evolu (công ty chủ). Prod dựng sạch 2026-11. Email tắt tới khi xác nhận domain: chưa có công tắc theo tenant
# (HUB_NOTIFY_MODE là chung toàn hệ thống) ⇒ ghi "Việc còn lại" ở docs/specs/cr159-onboard-users/tasks.md, KHÔNG khai notify_email.
# Chạy (idempotent) với MỘT mật khẩu chung lấy từ biến môi trường (KHÔNG ghi giá trị vào repo/yaml/log):
#   ONBOARD_PASSWORD=<mật khẩu> bun --env-file=.env.local apps/admin-api/src/modules/tenant-onboard/tenant-onboard.cli.ts \
#     --file deploy/tenants/evolu.yaml --actor <uuid platform admin> --password-env ONBOARD_PASSWORD [--no-force-change]
# Hoặc mật khẩu tạm ngẫu nhiên từng người: thay `--password-env …` bằng `--pw-out <file, quyền 600>`. Mặc định user mới bị ép đổi mật khẩu.
# `users:` mới ⇒ cần --password-env hoặc --pw-out; người đã có chỉ cập nhật tên/chức vụ/vai (không đổi mật khẩu). `admin` = quản trị công ty.
# Quản trị công ty phải đứng ĐẦU `users:` (tạo trước, tránh lỗi "quản trị cuối cùng" khi đổi vai).
# Mất mật khẩu tạm: đặt lại trên trang quản trị (Người dùng ⇒ Đặt lại mật khẩu); không chạy lại CLI để lấy.
