# CR-159 · tenant preschool. Email tắt tới khi xác nhận domain: chưa có công tắc theo tenant ⇒ xem "Việc còn lại" ở
# docs/specs/cr159-onboard-users/tasks.md. Chạy: như deploy/tenants/evolu.yaml (--password-env hoặc --pw-out).
