# sohoptac2-staging - edge-proxy: 4 host -test (app-test / ai-test / ai-test-admin / ai-test-hub .__BASE__) -> container sohoptac2-staging-web-1 (project sohoptac2-staging) theo cong noi bo.
# edge.sh chep file nay thanh edge-proxy/conf.d/sohoptac2-staging.conf (__BASE__ -> base domain) VA go ten -test khoi server_name cua conf.d/sohoptac2.conf (ten prod giu nguyen,
# van tro vao sohoptac2-web-1). TLS do host nginx (wildcard) lo; edge-proxy nhan HTTP thuong. `set $upstream` + resolver 127.0.0.11 giu nginx song khi container staging tat (502 thay vi reload loi).
# Ten map/log_format co tien to s2stg_ de khong dung voi s2_* cua sohoptac2.conf.
map $http_upgrade $s2stg_conn_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $s2stg_proto { default $http_x_forwarded_proto; '' $scheme; }
map $request_uri $s2stg_log_normal { ~^/partner-reply/ 0; default 1; }
map $request_uri $s2stg_log_partner { ~^/partner-reply/ 1; default 0; }
# /partner-reply/<token> mang token bi mat => khong ghi URI day du vao access log.
log_format s2stg_partner_rt '$remote_addr - - [$time_local] "$request_method /partner-reply/:token" $status $body_bytes_sent "-" "$http_user_agent"';

# ai-test = AI System portal + Chat AI (chat-web)
server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$s2stg_log_normal;
    access_log /var/log/nginx/access.log s2stg_partner_rt if=$s2stg_log_partner;
    server_name ai-test.__BASE__;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 110m;
    location / {
        set $upstream sohoptac2-staging-web-1:8083;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $s2stg_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $s2stg_conn_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }
}

