[project]
name = "mgmt-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "opensearch-py>=2.6",
  "neo4j>=5.20",
  "anthropic>=1.0",
  "openai>=1.40",
  "docling>=2.0",
  "tiktoken>=0.7",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "slack_sdk>=3.27",
  "httpx2>=2.12",
  "pywebpush>=2.0",
  "openpyxl>=3.1",          # Excel lists dropped in the chat (app/cks/importer.py)
  "cryptography>=43",       # signed XML/PDF: read the signer's certificate (app/signed)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27", "python-docx>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# two workers, whole files each (module fixtures share data): one OpenSearch prefix and one Neo4j per worker
# (tests/conftest.py). A single file: `pytest -p no:xdist tests/test_x.py` or `-n 0`.
addopts = "-n 2 --dist loadfile"
